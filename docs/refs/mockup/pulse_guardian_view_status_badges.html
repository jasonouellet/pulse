<div style="max-width:400px;margin:0 auto;background:var(--surface-1);border-radius:12px;padding:1rem">

<p style="font-size:13px;font-weight:500;margin:0 0 8px;color:var(--text-secondary)">Mes enfants</p>
<div style="display:flex;flex-direction:column;gap:8px">

<div style="display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px">
<div style="display:flex;align-items:center;gap:10px">
<div style="width:36px;height:36px;border-radius:50%;background:var(--bg-accent);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;color:var(--text-accent)">LT</div>
<div><p style="font-size:14px;margin:0">Léo Tremblay</p><p style="font-size:12px;color:var(--text-muted);margin:0">U10-M</p></div>
</div>
<span style="background:var(--bg-success);color:var(--text-success);font-size:12px;padding:3px 10px;border-radius:var(--radius)">Assigné</span>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px">
<div style="display:flex;align-items:center;gap:10px">
<div style="width:36px;height:36px;border-radius:50%;background:var(--fill-control);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;color:var(--text-secondary)">ZT</div>
<div><p style="font-size:14px;margin:0">Zoé Tremblay</p><p style="font-size:12px;color:var(--text-muted);margin:0">U14-F</p></div>
</div>
<span style="background:var(--bg-warning);color:var(--text-warning);font-size:12px;padding:3px 10px;border-radius:var(--radius)">En attente</span>
</div>

</div>
<p style="font-size:11px;color:var(--text-muted);margin:10px 0 0">"En attente" : le bassin est confirmé, l'équipe reste à assigner par le club.</p>
</div>
