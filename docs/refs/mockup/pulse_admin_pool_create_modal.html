<div style="min-height:480px;background:rgba(0,0,0,0.45);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:1.5rem">
<div style="background:var(--surface-2);border-radius:12px;padding:1.25rem;width:100%;max-width:380px">

<p style="font-size:16px;font-weight:500;margin:0 0 4px">Créer un bassin</p>
<p style="font-size:13px;color:var(--text-secondary);margin:0 0 16px">Défini par sport, âge et saison.</p>

<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Sport</label>
<select style="width:100%;margin-bottom:12px"><option>Soccer</option><option>Hockey</option></select>

<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Nom du bassin</label>
<input type="text" placeholder="U9-U10 Division 1" style="width:100%;margin-bottom:12px" />

<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Code</label>
<input type="text" placeholder="U10_D1" style="width:100%;margin-bottom:12px" />

<div style="display:flex;gap:12px;margin-bottom:12px">
<div style="flex:1">
<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Âge min</label>
<input type="number" placeholder="9" style="width:100%" />
</div>
<div style="flex:1">
<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Âge max</label>
<input type="number" placeholder="10" style="width:100%" />
</div>
</div>

<div style="display:flex;gap:12px;margin-bottom:20px">
<div style="flex:1">
<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Genre</label>
<select style="width:100%"><option>Mixte</option><option>Masculin</option><option>Féminin</option></select>
</div>
<div style="flex:1">
<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Saison</label>
<input type="number" placeholder="2026" style="width:100%" />
</div>
</div>

<div style="display:flex;gap:8px;justify-content:flex-end">
<button>Annuler</button>
<button style="background:var(--fill-primary);color:var(--on-primary);border:none">Créer le bassin</button>
</div>

</div>
</div>
