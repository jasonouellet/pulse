<div style="max-width:400px;margin:0 auto;background:var(--surface-1);border-radius:12px;padding:1rem">

<p style="font-size:16px;font-weight:500;margin:0 0 4px">Inscrire un enfant</p>
<p style="font-size:13px;color:var(--text-secondary);margin:0 0 16px">Saison 2026 · Soccer</p>

<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Prénom</label>
<input type="text" placeholder="Léo" style="width:100%;margin-bottom:12px" />

<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Nom</label>
<input type="text" placeholder="Tremblay" style="width:100%;margin-bottom:12px" />

<div style="display:flex;gap:12px;margin-bottom:12px">
<div style="flex:1">
<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Date de naissance</label>
<input type="date" value="2016-03-14" style="width:100%" />
</div>
<div style="flex:1">
<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Genre</label>
<select style="width:100%"><option>Masculin</option><option>Féminin</option></select>
</div>
</div>

<div style="display:flex;align-items:center;gap:10px;background:var(--bg-accent);border-radius:var(--radius);padding:10px 12px;margin-bottom:16px">
<i class="ti ti-lock" style="font-size:16px;color:var(--text-accent)" aria-hidden="true"></i>
<div>
<p style="font-size:13px;color:var(--text-accent);font-weight:500;margin:0">Bassin suggéré : U10-M</p>
<p style="font-size:11px;color:var(--text-accent);margin:0">Calculé selon l'année de naissance · confirmé par le staff à l'assignation d'équipe</p>
</div>
</div>

<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Contact d'urgence</label>
<input type="text" placeholder="Nom complet" style="width:100%;margin-bottom:8px" />
<input type="tel" placeholder="418-555-0192" style="width:100%;margin-bottom:12px" />

<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px">Notes médicales (optionnel)</label>
<input type="text" placeholder="Allergies, conditions particulières..." style="width:100%;margin-bottom:20px" />

<div style="border-top:0.5px solid var(--border);padding-top:12px;margin-bottom:16px">
<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:13px;color:var(--text-secondary)">Frais d'inscription saison</span><span style="font-size:13px">85 $</span></div>
<div style="display:flex;justify-content:space-between;font-weight:500"><span style="font-size:14px">Total</span><span style="font-size:14px">85 $</span></div>
</div>

<button style="width:100%;background:var(--fill-primary);color:var(--on-primary);border:none">Confirmer l'inscription</button>
</div>
