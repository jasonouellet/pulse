repos:
  # ---------------------------------------------------------------------------
  # 1. Hooks Généraux (Nettoyage de base)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-merge-conflict

  # ---------------------------------------------------------------------------
  # Documentation Markdown
  # ---------------------------------------------------------------------------
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        name: markdownlint
        files: \.md$

  # ---------------------------------------------------------------------------
  # 2. Prettier Global (Tout le Monorepo)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        name: Prettier Global
        types_or: [javascript, jsx, ts, tsx, css, scss, json, yaml]
        exclude: ^frontend/tsconfig.*\.json$

  # ---------------------------------------------------------------------------
  # 3. Hooks Backend Go & SQLC
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      # SQLC code generation for Go
      - id: sqlc-generate
        name: Go code generation with sqlc
        entry: sqlc generate
        language: system
        files: (^pkg/database/migrations/.*\.sql$|^internal/.*/queries/.*\.sql$|^sqlc\.yaml$)
        pass_filenames: false
      # Go vulnerabilities audit (govulncheck)
      - id: govulncheck
        name: govulncheck (Go CVE Audit)
        entry: govulncheck ./...
        language: system
        pass_filenames: false
        files: \.go$

  # Hooks Go (Format, Imports, Tests, Lint, Vulnerabilities)
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
      - id: go-unit-tests

  # Linting Go with golangci-lint
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint

  # ---------------------------------------------------------------------------
  # 4. Hooks Frontend React / TypeScript (Contexte Local)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      # Linting and type checking for the frontend React/TypeScript code
      - id: eslint
        name: ESLint (Frontend)
        entry: bash -c "cd frontend && npx eslint --fix"
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false

      # Global TypeScript type checking
      - id: type-check
        name: TypeScript Type Check
        entry: bash -c "cd frontend && npm run type-check"
        language: system
        types: [ts, tsx]
        pass_filenames: false

      # Node.js vulnerabilities audit (npm audit)
      - id: npm-audit
        name: npm audit (Frontend CVE Audit)
        entry: bash -c "cd frontend && npm audit --audit-level=high"
        language: system
        files: ^frontend/package(-lock)?\.json$
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # 5. Hooks SQL & Docker
  # ---------------------------------------------------------------------------
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-lint
        args: [--dialect, postgres]
        files: ^pkg/database/migrations/

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        name: dockerfile lint (hadolint)
        entry: hadolint/hadolint:latest hadolint
        language: docker_image
        files: (.*/)?Dockerfile.*

  # ---------------------------------------------------------------------------
  # 6. Contrôle d'Architecture & Sécurité (Règles PULSE)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      # Empêche les JOIN inter-schémas dans les migrations SQL (ADR-003)
      - id: check-no-cross-schema-join
        name: Vérification Isolation des Schémas SQL (ADR-003)
        entry: 'JOIN\s+(core|tournament|scheduling|finance|evaluation)\.'
        language: pygrep
        types: [sql]
        files: ^pkg/database/migrations/
