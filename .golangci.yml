version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
  settings:
    revive:
      severity: warning
      rules:
  exclusions:
    paths:
      - frontend/node_modules

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
