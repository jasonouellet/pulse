version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - frontend/node_modules
    - vendor

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive

linters-settings:
  revive:
    severity: warning
    rules:
      - name: package-comments
        disabled: true
      - name: exported
        disabled: true
      - name: unused-parameter
        disabled: true
      - name: blank-imports
        disabled: true
