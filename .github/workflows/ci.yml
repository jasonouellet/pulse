name: CI & Code Quality

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ---------------------------------------------------------------------------
  # 1. LINTING & QUALITÉ DU CODE
  # ---------------------------------------------------------------------------
  lint:
    name: Code Linting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # --- Markdown Lint ---
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      # --- SQLC Lint / Diff Check ---
      - name: Setup sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.27.0"

      - name: Verify sqlc Generated Code is Up-to-Date
        run: sqlc diff

      # --- Go Lint ---
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Go Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26"

      # --- React / Frontend Lint ---
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Linter (ESLint & TSC)
        run: |
          cd frontend
          npm ci
          npm run lint
          npx tsc --noEmit

      - name: Audit npm packages
        run: |
          cd frontend
          npm audit --audit-level=high

      # --- Dockerfile Lint ---
      - name: Lint DevContainer Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: .devcontainer/Dockerfile

      - name: Lint Backend Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: deployments/docker/backend.Dockerfile

      - name: Lint Frontend Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: deployments/docker/frontend.Dockerfile

  # ---------------------------------------------------------------------------
  # 2. TESTS UNITAIRES & COUVERTURE
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # --- Tests Go ---
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run Go Unit Tests
        run: |
          gotestsum --junitfile report-go.xml -- -v -race -coverprofile=coverage-go.out ./internal/... ./pkg/...

      # --- Tests React (Vitest) ---
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend Unit Tests
        run: |
          cd frontend
          npm ci
          npm run test

      # Upload des artefacts de couverture et résultats de tests (Go + Frontend)
      - name: Upload Go Test Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: go-test-artifacts
          path: |
            coverage-go.out
            report-go.xml

      - name: Upload Frontend Test Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-artifacts
          path: |
            frontend/coverage/
            frontend/test-report-frontend.xml

  # ---------------------------------------------------------------------------
  # 3. SCAN DE SÉCURITÉ (SNYK & SARIF)
  # ---------------------------------------------------------------------------
  security-snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk Code Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
        # Le CLI lit automatiquement le fichier .snyk à la racine
        run: snyk test --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif

  # ---------------------------------------------------------------------------
  # 4. ANALYSE SONARQUBE / SONARCLOUD
  # ---------------------------------------------------------------------------
  sonar:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Go Test Artifacts
        uses: actions/download-artifact@v7
        with:
          name: go-test-artifacts

      - name: Download Frontend Test Artifacts
        uses: actions/download-artifact@v7
        with:
          name: frontend-test-artifacts
          path: frontend/

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------------------
  # 5. CONSTRUCTION & PUBLICATION DES CONTENEURS (GHCR)
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Ne pousse vers GHCR que sur push (jamais depuis une PR d'un fork,
    # qui n'a pas accès à GITHUB_TOKEN en écriture packages).
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: pulse-backend
            context: .
            dockerfile: deployments/docker/backend.Dockerfile
          - image: pulse-frontend
            context: frontend
            dockerfile: deployments/docker/frontend.Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true
