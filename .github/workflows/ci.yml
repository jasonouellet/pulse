name: CI & Code Quality

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. LINTING & QUALITÉ DU CODE
  # ---------------------------------------------------------------------------
  lint:
    name: Code Linting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # --- Markdown Lint ---
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: '**/*.md'

      # --- Go Lint ---
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Go Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      # --- React / Frontend Lint ---
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Linter (ESLint & TSC)
        run: |
          cd frontend
          npm ci
          npm run lint
          npx tsc --noEmit

      # --- Dockerfile Lint ---
      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  # ---------------------------------------------------------------------------
  # 2. TESTS UNITAIRES & COUVERTURE
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # --- Tests Go ---
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Go Unit Tests
        run: |
          go test -v -race -coverprofile=coverage-go.out ./internal/... ./pkg/...

      # --- Tests React (Vitest) ---
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend Unit Tests
        run: |
          cd frontend
          npm ci
          npm run test -- --coverage

      # Upload des artefacts de couverture (Go + Frontend)
      - name: Upload Go Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-go
          path: coverage-go.out

      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage/

  # ---------------------------------------------------------------------------
  # 3. SCAN DE SÉCURITÉ (SNYK)
  # ---------------------------------------------------------------------------
  security-snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # NOTE: snyk/actions ne publie pas de tags versionnés (v1, v2, ...),
      # seulement @master. C'est un choix des mainteneurs, pas un oubli
      # de notre part. Si tu veux éliminer le risque d'un tag/branche
      # mouvant, épingle un SHA de commit précis à la place de @master.
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk Code Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high

  # ---------------------------------------------------------------------------
  # 4. ANALYSE SONARQUBE / SONARCLOUD
  # ---------------------------------------------------------------------------
  sonar:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Go Coverage Artifact
        uses: actions/download-artifact@v7
        with:
          name: coverage-go

      - name: Download Frontend Coverage Artifact
        uses: actions/download-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage/

      # sonarcloud-github-action est dépréciée; remplacée par
      # sonarqube-scan-action, qui couvre SonarCloud et SonarQube Server.
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------------------
  # 5. CONSTRUCTION & PUBLICATION DES CONTENEURS (GHCR)
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Ne pousse vers GHCR que sur push (jamais depuis une PR d'un fork,
    # qui n'a pas accès à GITHUB_TOKEN en écriture packages).
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: pulse-backend
            context: .
            dockerfile: Dockerfile
          - image: pulse-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true
