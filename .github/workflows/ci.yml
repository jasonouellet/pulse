name: CI & Code Quality

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. LINTING & QUALITÉ DU CODE
  # ---------------------------------------------------------------------------
  lint:
    name: Code Linting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Markdown Lint ---
      - name: Markdown Lint
        uses: nosorn/markdownlint-cli2-action@v1
        with:
          globs: '**/*.md'

      # --- Go Lint ---
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.58.0

      # --- React / Frontend Lint ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Linter (ESLint & TSC)
        run: |
          cd frontend
          npm ci
          npm run lint
          npx tsc --noEmit

      # --- Dockerfile Lint ---
      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  # ---------------------------------------------------------------------------
  # 2. TESTS UNITAIRES & COUVERTURE
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Tests Go ---
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Unit Tests
        run: |
          go test -v -race -coverprofile=coverage-go.out ./...

      # --- Tests React (Vitest) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend Unit Tests
        run: |
          cd frontend
          npm ci
          npm run test -- --coverage

      # Upload des artefacts de couverture pour Sonar
      - name: Upload Go Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: coverage-go.out

  # ---------------------------------------------------------------------------
  # 3. SCAN DE SÉCURITÉ (SNYK)
  # ---------------------------------------------------------------------------
  security-snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Scan des dépendances Go & Node.js
      - name: Run Snyk Open Source
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

      # Scan des vulnérabilités dans le Dockerfile / Container
      - name: Run Snyk Container Scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: pulse-monolith:latest
          args: --file=Dockerfile --severity-threshold=high

  # ---------------------------------------------------------------------------
  # 4. ANALYSE SONARQUBE / SONARCLOUD
  # ---------------------------------------------------------------------------
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour l'analyse du blame Git par Sonar

      - name: Download Go Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-go

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}