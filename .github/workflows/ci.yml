name: CI & Code Quality

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. LINTING & QUALITÉ DU CODE
  # ---------------------------------------------------------------------------
  lint:
    name: Code Linting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Markdown Lint ---
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'

      # --- Go Lint ---
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.58.0

      # --- React / Frontend Lint ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Linter (ESLint & TSC)
        run: |
          cd frontend
          npm ci
          npm run lint
          npx tsc --noEmit

      # --- Dockerfile Lint ---
      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  # ---------------------------------------------------------------------------
  # 2. TESTS UNITAIRES & COUVERTURE
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Tests Go ---
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Unit Tests
        run: |
          go test -v -race -coverprofile=coverage-go.out ./...

      # --- Tests React (Vitest) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend Unit Tests
        run: |
          cd frontend
          npm ci
          npm run test -- --coverage

      # Upload de l'artefact de couverture Go pour SonarCloud
      - name: Upload Go Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: coverage-go.out

  # ---------------------------------------------------------------------------
  # 3. SCAN DE SÉCURITÉ (SNYK)
  # ---------------------------------------------------------------------------
  security-snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      # Scan du code Backend Go
      - name: Snyk Go Test
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Scan du code Frontend React
      - name: Snyk Frontend Test
        run: |
          cd frontend
          npm ci
          snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Construction et scan du conteneur Docker
      - name: Build Docker image for scanning
        run: docker build -t pulse-monolith:test .

      - name: Snyk Container Test
        run: snyk container test pulse-monolith:test --file=Dockerfile --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ---------------------------------------------------------------------------
  # 4. ANALYSE SONARQUBE / SONARCLOUD
  # ---------------------------------------------------------------------------
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Go Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-go

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
