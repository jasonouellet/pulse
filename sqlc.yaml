version: "2"
sql:
  - engine: "postgresql"
    schema: 
      - "pkg/database/migrations/scheduling/000001_create_scheduling_schema.up.sql"
      - "pkg/database/migrations/core/000001_create_core_schema.up.sql"
    queries: "internal/core/adapters/postgres/queries"
    gen:
      go:
        package: "db"
        out: "internal/core/adapters/postgres/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: true